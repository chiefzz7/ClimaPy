[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climapy-backend"
version = "0.2.0"
description = "Backend Python 3.12 seguro para previsão do tempo horária, alertas sem login e futura camada de IA."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "cryptography>=43.0.0,<47.0.0",
    "cachetools>=5.5.0,<6.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "pywebpush>=2.0.0,<3.0.0",
    "apscheduler>=3.10.4,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "respx>=0.21.1,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "bandit>=1.8.0,<2.0.0",
    "types-cachetools>=5.5.0,<6.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "slowapi",
    "slowapi.*",
    "pywebpush",
    "pywebpush.*",
    "py_vapid",
    "py_vapid.*",
    "apscheduler",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
